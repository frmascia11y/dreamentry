<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Sogni"/>
<title>Diario dei Sogni</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--p:#534AB7;--pl:#EEEDFE;--pm:#7F77DD;--pt:#26215C;--bg:#f8f7ff;--white:#fff;--b1:#e2e8f0;--t1:#1e293b;--t2:#64748b;--t3:#94a3b8}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--t1);min-height:100dvh}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 60px}
*{box-sizing:border-box}
/* buttons */
.bp{display:flex;align-items:center;justify-content:center;background:var(--p);color:#fff;border:none;border-radius:12px;padding:14px 24px;font-size:16px;font-weight:600;cursor:pointer;min-height:52px;width:100%;touch-action:manipulation}
.bp:active{background:#3C3489}
.bs{display:flex;align-items:center;justify-content:center;background:var(--white);color:var(--p);border:2px solid var(--p);border-radius:12px;padding:12px 24px;font-size:16px;font-weight:600;cursor:pointer;min-height:52px;width:100%;touch-action:manipulation}
.bs:active{background:var(--pl)}
.bg{background:none;border:none;color:var(--t3);font-size:14px;cursor:pointer;padding:12px;text-decoration:underline;text-underline-offset:3px;width:100%;touch-action:manipulation}
/* inputs */
input[type=text],input[type=date],textarea{width:100%;padding:14px;border:1.5px solid var(--b1);border-radius:12px;font-size:16px;background:var(--white);color:var(--t1);outline:none;font-family:inherit;-webkit-appearance:none;appearance:none;display:block}
input[type=text]:focus,input[type=date]:focus,textarea:focus{border-color:var(--p)}
textarea{resize:none;line-height:1.6}
/* progress */
.prog{display:flex;gap:3px;margin-bottom:20px}
.ps{flex:1;height:3px;border-radius:99px}
/* header */
.hdr{display:flex;align-items:flex-start;gap:12px;margin-bottom:22px}
.lbl-sm{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.lbl-lg{font-size:20px;font-weight:700;line-height:1.3;color:var(--t1)}
.lbl-sub{font-size:13px;color:var(--t3);margin-top:3px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.chip{padding:8px 16px;border-radius:999px;font-size:14px;border:1.5px solid var(--b1);background:var(--white);color:var(--t2);cursor:pointer;touch-action:manipulation;-webkit-appearance:none;user-select:none}
.chip.on{font-weight:600}
/* accordion */
.acc-wrap{border:1.5px solid var(--b1);border-radius:12px;overflow:hidden;margin-bottom:8px}
.acc-btn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;background:var(--white);border:none;border-top:1.5px solid var(--b1);cursor:pointer;font-size:14px;font-weight:600;color:var(--t2);text-align:left;touch-action:manipulation}
.acc-btn:first-of-type{border-top:none}
.acc-body{padding:12px 14px 16px;border-top:1.5px solid var(--b1)}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;display:inline-block}
/* domande */
.dq-btn{width:100%;text-align:left;padding:13px 14px;border-radius:12px;font-size:14px;line-height:1.5;border:1.5px solid var(--b1);background:var(--white);color:var(--t1);margin-bottom:8px;cursor:pointer;touch-action:manipulation;-webkit-appearance:none}
.dq-btn.on{border-color:var(--p);background:var(--pl);color:var(--pt);font-weight:600}
/* cta row */
.cta{display:grid;gap:10px;margin-top:28px}
.cta2{grid-template-columns:1fr 2fr}
/* preview */
.card-top{background:var(--pl);border:1.5px solid var(--pm);border-radius:16px;padding:16px;margin-bottom:22px}
.pv-sec{margin-bottom:16px}
.pv-lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.tag{display:inline-flex;padding:4px 12px;border-radius:999px;font-size:12px;margin:2px;border:1px solid}
.sep{height:1px;background:var(--b1);margin:22px 0}
/* boxes */
.ok-box{background:#E1F5EE;border:1.5px solid #0F6E56;border-radius:12px;padding:16px;margin-top:16px;color:#04342C;font-size:14px;line-height:1.8;text-align:center}
.err-box{background:#FFF3CD;border:1.5px solid #FFCA2C;border-radius:12px;padding:16px;margin-top:16px;color:#664D03;font-size:13px;line-height:1.7}
.copy-ta{width:100%;padding:10px;border:1px solid var(--b1);border-radius:8px;font-size:12px;background:#f8fafc;color:var(--t2);margin-top:10px;min-height:80px;resize:none}
.hint{font-size:13px;color:var(--t2);line-height:1.6;padding:11px 14px;background:#f8fafc;border-radius:10px;margin-bottom:16px;border-left:3px solid var(--pm)}
.today-row{margin-top:12px}
.ctx-pill{padding:8px 12px;background:#f8fafc;border-radius:8px;border-left:2px solid var(--b1);font-size:13px;color:var(--t3);font-style:italic;margin-bottom:12px;line-height:1.5}
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row input{flex:1}
.add-row .bs{width:auto;padding:12px 16px;font-size:14px;min-height:44px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ─── Config ───────────────────────────────────────────────────────
const PROXY = "https://notion-proxy.fr-mascia.workers.dev";
const DB    = "3244c0d68c1d495ca1846b9ff75d6ecb";

// ─── Data ─────────────────────────────────────────────────────────
const SENS = {
  "Respirazione":{bg:"#E1F5EE",bd:"#0F6E56",tx:"#04342C",items:["Respiro corto","Fiato sospeso","Petto stretto","Groppo in gola","Respiro profondo"]},
  "Cuore":       {bg:"#FAECE7",bd:"#993C1D",tx:"#4A1B0C",items:["Cuore accelerato","Calore improvviso","Brividi","Pulsazioni al collo"]},
  "Muscoli":     {bg:"#FAEEDA",bd:"#854F0B",tx:"#412402",items:["Tensione alle spalle","Mascella serrata","Gambe pesanti","Gambe molli","Tremore","Scatto al risveglio"]},
  "Pelle & nervi":{bg:"#EEEDFE",bd:"#534AB7",tx:"#26215C",items:["Pelle d'oca","Formicolio","Sudore","Sensazione di tocco"]},
  "Pancia":      {bg:"#FAECE7",bd:"#993C1D",tx:"#4A1B0C",items:["Stomaco chiuso","Nausea","Peso alla pancia","Vuoto allo stomaco"]},
  "Testa":       {bg:"#E1F5EE",bd:"#0F6E56",tx:"#04342C",items:["Testa piena","Occhi pesanti","Confusione","Leggerezza","Galleggiamento"]},
};
const EMOZ = {
  "Attivazione":{bg:"#FAECE7",bd:"#993C1D",tx:"#4A1B0C",items:["Ansia","Paura","Agitazione","Urgenza","Eccitazione"]},
  "Inibizione": {bg:"#FAEEDA",bd:"#854F0B",tx:"#412402",items:["Vergogna","Colpa","Imbarazzo","Disgusto","Ritiro"]},
  "Distanza":   {bg:"#EEEDFE",bd:"#534AB7",tx:"#26215C",items:["Solitudine","Abbandono","Tristezza","Vuoto","Malinconia"]},
  "Potere":     {bg:"#FAECE7",bd:"#993C1D",tx:"#4A1B0C",items:["Rabbia","Frustrazione","Controllo","Orgoglio"]},
  "Apertura":   {bg:"#E1F5EE",bd:"#0F6E56",tx:"#04342C",items:["Curiosità","Stupore","Gioia","Leggerezza","Fiducia"]},
  "Connessione":{bg:"#EAF3DE",bd:"#3B6D11",tx:"#173404",items:["Affetto","Sollievo","Gratitudine","Nostalgia","Tenerezza"]},
  "Ambivalenza":{bg:"#FAEEDA",bd:"#854F0B",tx:"#412402",items:["Confusione","Resa","Disagio","Esplorazione","Disorientamento"]},
};
const SIMB_DEF = ["Sguardo","Verde","Sauna","Corpo maschile","Casa","Acqua","Identità","Ordine/disordine","Passaggio","Pulizia","Esposizione","Protezione"];
const DQS = [
  "Cosa mi ha lasciato questo sogno — emozione, immagine, sensazione?",
  "Questa figura o luogo mi ricorda qualcuno nella mia vita reale?",
  "C'è una parte di me rappresentata da questo personaggio o simbolo?",
  "Questo sogno sta compensando qualcosa che sto evitando?",
  "Cosa avrei voluto fare diversamente — e cosa me lo ha impedito?",
];
const STEPS = ["data","luogo","trama","personaggi","sensazioni","emozioni","simboli","associazioni","domande","titolo"];
const META = {
  data:        ["Quando?",                    "Data del sogno"],
  luogo:       ["Dove eri?",                  "Il posto, l'atmosfera, la luce"],
  trama:       ["Cosa è successo?",            "Dal luogo, ricostruisci la scena"],
  personaggi:  ["Chi c'era?",                 "Persone, figure — salta se nessuno"],
  sensazioni:  ["Cosa hai sentito nel corpo?", "Il corpo ricorda prima della mente"],
  emozioni:    ["Quali emozioni?",             "Arrivano dopo le sensazioni"],
  simboli:     ["Simboli importanti",          "Elementi carichi di significato"],
  associazioni:["Connessioni col pregresso",   "Questo tema è già comparso?"],
  domande:     ["Domande per la seduta",       "Seleziona o scrivi liberamente"],
  titolo:      ["Dai un titolo al sogno",      "Ora che hai il quadro completo"],
};

// ─── State ────────────────────────────────────────────────────────
const S = {
  step:0, view:"form", status:null, errMsg:"", copied:false,
  data:"", luogo:"", trama:"", personaggi:"",
  associazioni:"", altreNota:"", titolo:"",
  sens:[], emoz:[], simb:[], dqs:[],
  simbExtra:[], accOpen:{},
};

// ─── Utils ────────────────────────────────────────────────────────
function todayISO(){
  const d=new Date();
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}
function todayHuman(){
  return new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'long'});
}
function dateHuman(iso){
  if(!iso)return'';
  return new Date(iso+'T12:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
}
function logo(){
  return `<svg width="36" height="36" viewBox="0 0 32 32" fill="none">
    <circle cx="16" cy="16" r="15" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <path d="M20 10.5C17.5 10.5 15 12.7 15 16C15 19.3 17.5 21.5 20 21.5C18.8 22.4 17.5 23 16 23C12.1 23 9 19.9 9 16C9 12.1 12.1 9 16 9C17.5 9 18.8 9.6 20 10.5Z" fill="#534AB7"/>
    <circle cx="23" cy="11" r="1" fill="#7F77DD"/>
    <circle cx="25" cy="15" r="0.7" fill="#AFA9EC"/>
    <circle cx="22" cy="18" r="0.6" fill="#7F77DD"/>
  </svg>`;
}

// ─── Render ───────────────────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML = S.view==='preview' ? renderPreview() : renderForm();
  bindEvents();
}

function renderForm(){
  const id = STEPS[S.step];
  const [title, sub] = META[id];
  const last = S.step === STEPS.length-1;

  const prog = STEPS.map((_,i) =>
    `<div class="ps" style="background:${i<S.step?'#7F77DD':i===S.step?'#534AB7':'#e2e8f0'}"></div>`
  ).join('');

  let body = '';

  if(id==='data') body = `
    <input type="date" id="f_data" value="${S.data}" autocomplete="off"/>
    <div class="today-row">
      <button class="bp" id="btn_today">Usa oggi — ${todayHuman()} →</button>
    </div>`;

  if(id==='luogo') body = `
    <textarea id="f_luogo" rows="5"
      placeholder="Una stanza enorme, soffitti altissimi.&#10;Luce fredda, quasi ospedaliera.&#10;Silenzio pesante.">${S.luogo}</textarea>`;

  if(id==='trama') body = `
    <textarea id="f_trama" rows="6"
      placeholder="Cosa è successo…">${S.trama}</textarea>`;

  if(id==='personaggi'){
    const ctx = S.luogo.trim().split('\n').filter(l=>l.trim())[0] || '';
    body = `
      ${ctx.length>5 ? `<div class="ctx-pill">${ctx}</div>` : ''}
      <textarea id="f_pers" rows="5"
        placeholder="Zia Anna&#10;Un collega sconosciuto&#10;Una figura minacciosa">${S.personaggi}</textarea>`;
  }

  if(id==='sensazioni') body = `
    <div class="hint">Cosa hai sentito nel corpo al risveglio o durante il sogno?</div>
    ${renderAcc(SENS, S.sens, 'sens')}`;

  if(id==='emozioni') body = `
    <div class="hint">Le emozioni emergono dai segnali fisici. Scegli quelle chiare, completa in seduta.</div>
    ${renderAcc(EMOZ, S.emoz, 'emoz')}`;

  if(id==='simboli') body = `
    <div class="chips" id="chips_simb">
      ${[...SIMB_DEF,...S.simbExtra].map(it => chipHtml(it, S.simb.includes(it), '#EEEDFE','#534AB7','#26215C', 'simb')).join('')}
    </div>
    <div class="add-row">
      <input type="text" id="f_newsim" placeholder="Aggiungi simbolo…"/>
      <button class="bs" id="btn_addsim">+ Aggiungi</button>
    </div>`;

  if(id==='associazioni') body = `
    <div class="hint">Questo tema è già comparso in altri sogni? Cosa ti ricorda della tua vita ora?</div>
    <textarea id="f_assoc" rows="5"
      placeholder="Es. Il corridoio mi ricorda il sogno di marzo…">${S.associazioni}</textarea>`;

  if(id==='domande') body = `
    <div class="hint" style="border-color:#534AB7">Seleziona le domande che risuonano — ti aiuteranno in seduta.</div>
    ${DQS.map((q,i) => `
      <button class="dq-btn${S.dqs.includes(q)?' on':''}" data-dq="${i}" touch-action="manipulation">
        ${S.dqs.includes(q)?'✓ ':''}${q}
      </button>`).join('')}
    <div class="sep"></div>
    <div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:8px">Altra domanda</div>
    <textarea id="f_altre" rows="3" placeholder="Scrivi una domanda libera…">${S.altreNota}</textarea>`;

  if(id==='titolo') body = `
    <input type="text" id="f_titolo" value="${S.titolo}"
      placeholder="Es. Corridoio / sauna / castello"
      autocomplete="off" autocorrect="off" spellcheck="false"
      style="font-size:18px;padding:14px;font-weight:600"/>`;

  return `
    <div class="prog">${prog}</div>
    <div class="hdr">
      ${logo()}
      <div>
        <div class="lbl-sm">${S.step+1} / ${STEPS.length}</div>
        <div class="lbl-lg">${title}</div>
        <div class="lbl-sub">${sub}</div>
      </div>
    </div>
    ${body}
    <div class="cta ${S.step>0?'cta2':''}">
      ${S.step>0 ? `<button class="bs" id="btn_back">← Indietro</button>` : ''}
      <button class="bp" id="btn_next">${last?'Vedi scheda →':'Avanti →'}</button>
    </div>
    <button class="bg" id="btn_skip">Salta questo passo</button>`;
}

function chipHtml(label, on, bg, bd, tx, arr){
  const style = on ? `background:${bg};color:${tx};border-color:${bd}` : '';
  return `<button class="chip${on?' on':''}" data-arr="${arr}" data-val="${label.replace(/"/g,'&quot;')}" style="${style}" touch-action="manipulation">${label}</button>`;
}

function renderAcc(groups, sel, arr){
  return Object.entries(groups).map(([g,d]) => {
    const open = !!S.accOpen[g];
    const n = d.items.filter(x=>sel.includes(x)).length;
    const genc = g.replace(/"/g,'&quot;');
    const chips = open ? `<div class="acc-body"><div class="chips">
      ${d.items.map(it => chipHtml(it, sel.includes(it), d.bg, d.bd, d.tx, arr)).join('')}
    </div></div>` : '';
    return `<div class="acc-wrap">
      <button class="acc-btn" data-acc="${genc}" style="${open?`background:${d.bg};color:${d.tx}`:''}">
        <span>${g}</span>
        <span style="display:flex;align-items:center;gap:6px">
          ${n?`<span class="badge" style="background:${d.bd}">${n}</span>`:''}
          <span>${open?'▲':'▼'}</span>
        </span>
      </button>
      ${chips}
    </div>`;
  }).join('');
}

function renderPreview(){
  const df = dateHuman(S.data);
  const ps = S.personaggi.split('\n').filter(Boolean);
  const dqs = [...S.dqs, ...(S.altreNota.trim()?[S.altreNota.trim()]:[])];
  const st = S.status;

  const sec = (label, html) => html ? `<div class="pv-sec"><div class="pv-lbl">${label}</div>${html}</div>` : '';
  const tags = (items,bg,tx,bd) => `<div style="display:flex;flex-wrap:wrap">${items.map(t=>
    `<span class="tag" style="background:${bg};color:${tx};border-color:${bd}">${t}</span>`).join('')}</div>`;

  return `
    <div class="card-top">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        ${logo()}
        <span style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#7F77DD">Scheda sogno</span>
      </div>
      <div style="font-size:20px;font-weight:700;color:#26215C;line-height:1.3">${S.titolo||'Sogno del '+df}</div>
      <div style="font-size:13px;color:#534AB7;margin-top:4px">${df}</div>
    </div>
    ${sec('Dove eri?', S.luogo?`<p style="font-size:14px;color:var(--t2);font-style:italic;line-height:1.7">${S.luogo}</p>`:'')}
    ${sec('Trama', S.trama?`<p style="font-size:14px;color:var(--t1);line-height:1.7">${S.trama}</p>`:'')}
    ${sec('Personaggi', ps.length?ps.map(p=>`<div style="font-size:14px;padding:2px 0">— ${p}</div>`).join(''):'')}
    ${sec('Sensazioni fisiche', S.sens.length?tags(S.sens,'#E1F5EE','#04342C','#0F6E56'):'')}
    ${sec('Emozioni', S.emoz.length?tags(S.emoz,'#FAECE7','#4A1B0C','#993C1D'):'')}
    ${sec('Simboli', S.simb.length?tags(S.simb,'#EEEDFE','#26215C','#534AB7'):'')}
    ${sec('Connessioni col pregresso', S.associazioni?`<p style="font-size:14px;color:var(--t2);font-style:italic;line-height:1.7">${S.associazioni}</p>`:'')}
    ${sec('Domande per la seduta', dqs.length?dqs.map((d,i)=>`<div style="font-size:14px;background:#f8fafc;border-radius:8px;padding:8px 12px;margin-bottom:6px">↗ ${d}</div>`).join(''):'')}
    <div class="sep"></div>
    <div style="display:flex;gap:10px">
      <button class="bs" id="btn_edit" style="flex:1">← Modifica</button>
      <button class="bp" id="btn_save" style="flex:2;${st==='done'?'opacity:.5':''}"
        ${st==='saving'||st==='done'?'disabled':''}>
        ${st==='saving'?'Salvataggio…':st==='done'?'✓ Salvato':'Salva su Notion'}
      </button>
    </div>
    ${st==='done'?`<div class="ok-box">✓ Sogno salvato nel diario<br>
      <button class="bg" id="btn_reset" style="color:#0F6E56;margin-top:6px">Aggiungi un altro sogno</button>
    </div>`:''}
    ${st==='error'?`<div class="err-box">
      ⚠️ ${S.errMsg||'Errore durante il salvataggio.'}<br><br>
      <button class="bp" id="btn_retry" style="margin-bottom:12px">Riprova</button>
      <div style="font-size:12px;margin-bottom:6px">Oppure copia e incolla nella chat con Claude:</div>
      <textarea class="copy-ta" id="copyTa" readonly>${buildCopyText()}</textarea>
      <button class="bg" id="btn_copy">${S.copied?'✓ Copiato!':'Copia negli appunti'}</button>
    </div>`:''}`;
}

// ─── Events ───────────────────────────────────────────────────────
function bindEvents(){
  // sync text fields from DOM -> state before navigating
  function sync(){
    const id = STEPS[S.step];
    if(id==='trama')        { const e=document.getElementById('f_trama');   if(e) S.trama=e.value; }
    if(id==='luogo')        { const e=document.getElementById('f_luogo');   if(e) S.luogo=e.value; }
    if(id==='personaggi')   { const e=document.getElementById('f_pers');    if(e) S.personaggi=e.value; }
    if(id==='associazioni') { const e=document.getElementById('f_assoc');   if(e) S.associazioni=e.value; }
    if(id==='domande')      { const e=document.getElementById('f_altre');   if(e) S.altreNota=e.value; }
    if(id==='titolo')       { const e=document.getElementById('f_titolo');  if(e) S.titolo=e.value; }
    if(id==='data')         { const e=document.getElementById('f_data');    if(e&&e.value) S.data=e.value; }
  }

  function on(id, ev, fn){ const e=document.getElementById(id); if(e) e.addEventListener(ev,fn); }

  on('btn_next','click',()=>{ sync(); if(S.step<STEPS.length-1){S.step++;}else{S.view='preview';} render(); });
  on('btn_back','click',()=>{ sync(); if(S.step>0){S.step--;} render(); });
  on('btn_skip','click',()=>{ sync(); if(S.step<STEPS.length-1){S.step++;} render(); });
  on('btn_today','click',()=>{ S.data=todayISO(); S.step++; render(); });
  on('btn_addsim','click',()=>{
    const e=document.getElementById('f_newsim'); if(!e)return;
    const v=e.value.trim();
    if(v&&!S.simbExtra.includes(v)&&!SIMB_DEF.includes(v)){S.simbExtra.push(v);S.simb.push(v);}
    render();
  });
  on('btn_edit','click',()=>{ S.view='form'; S.status=null; render(); });
  on('btn_save','click',()=>saveToNotion());
  on('btn_reset','click',()=>{ Object.assign(S,{step:0,view:'form',status:null,errMsg:'',copied:false,data:'',luogo:'',trama:'',personaggi:'',associazioni:'',altreNota:'',titolo:'',sens:[],emoz:[],simb:[],dqs:[],simbExtra:[],accOpen:{}}); render(); });
  on('btn_retry','click',()=>saveToNotion());
  on('btn_copy','click',()=>{
    const e=document.getElementById('copyTa');
    if(!e)return;
    if(navigator.clipboard){navigator.clipboard.writeText(e.value).catch(()=>{});}
    else{e.select();try{document.execCommand('copy');}catch(err){}}
    S.copied=true; render();
    setTimeout(()=>{S.copied=false; render();},2500);
  });

  // chip toggle (sensazioni, emozioni, simboli)
  document.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const arr=btn.dataset.arr, val=btn.dataset.val;
      if(!arr||!val)return;
      const a=S[arr];
      S[arr]=a.includes(val)?a.filter(x=>x!==val):[...a,val];
      render();
    });
  });

  // domande toggle
  document.querySelectorAll('.dq-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=parseInt(btn.dataset.dq);
      const q=DQS[i];
      S.dqs=S.dqs.includes(q)?S.dqs.filter(x=>x!==q):[...S.dqs,q];
      render();
    });
  });

  // accordion
  document.querySelectorAll('.acc-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      sync();
      const g=btn.dataset.acc;
      S.accOpen[g]=!S.accOpen[g];
      render();
    });
  });
}

// ─── Notion save ──────────────────────────────────────────────────
function buildCopyText(){
  const df = dateHuman(S.data);
  const ps = S.personaggi.split('\n').filter(Boolean).map(p=>'- '+p).join('\n');
  const dqs = [...S.dqs,...(S.altreNota.trim()?[S.altreNota.trim()]:[])]
    .map((d,i)=>(i+1)+'. '+d).join('\n');
  return ['Aggiungi al diario Notion:','Data: '+df,'Titolo: '+(S.titolo||'—'),
    S.sens.length?'Sensazioni: '+S.sens.join(', '):'',
    S.emoz.length?'Emozioni: '+S.emoz.join(', '):'',
    S.simb.length?'Simboli: '+S.simb.join(', '):'','',
    S.luogo?'## Dove eri?\n'+S.luogo:'',
    S.trama?'## Trama\n'+S.trama:'',
    ps?'## Personaggi\n'+ps:'',
    S.associazioni?'## Connessioni col pregresso\n'+S.associazioni:'',
    dqs?'## Domande per la seduta\n'+dqs:'',
  ].filter(Boolean).join('\n');
}

async function saveToNotion(){
  S.status='saving'; render();
  try{
    const ps = S.personaggi.split('\n').filter(Boolean);
    const dqs = [...S.dqs,...(S.altreNota.trim()?[S.altreNota.trim()]:[])];
    const ch=[];
    const h2 = t => ch.push({object:'block',type:'heading_2',heading_2:{rich_text:[{type:'text',text:{content:t}}]}});
    const p  = t => { if(t&&t.trim()) ch.push({object:'block',type:'paragraph',paragraph:{rich_text:[{type:'text',text:{content:t}}]}}); };
    if(S.luogo)          { h2('Dove eri?'); p(S.luogo); }
    if(S.trama)          { h2('Trama'); p(S.trama); }
    if(ps.length)        { h2('Personaggi'); ps.forEach(x=>p('— '+x)); }
    if(S.sens.length)    { h2('Sensazioni fisiche'); p(S.sens.join(', ')); }
    if(S.emoz.length)    { h2('Emozioni'); p(S.emoz.join(', ')); }
    if(S.simb.length)    { h2('Simboli'); p(S.simb.join(', ')); }
    if(S.associazioni)   { h2('Connessioni col pregresso'); p(S.associazioni); }
    if(dqs.length)       { h2('Domande per la seduta'); dqs.forEach((d,i)=>p((i+1)+'. '+d)); }

    const res = await fetch(PROXY, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        parent:{database_id:DB},
        properties:{
          Titolo:{title:[{text:{content:S.titolo||'Sogno senza titolo'}}]},
          Data:{date:{start:S.data||todayISO()}},
          Simboli:{multi_select:S.simb.map(n=>({name:n}))},
        },
        children:ch,
      }),
    });
    const data = await res.json();
    if(res.ok){ S.status='done'; }
    else { S.status='error'; S.errMsg=data.message||'Errore Notion ('+res.status+').'; }
  } catch(e){
    S.status='error'; S.errMsg='Errore di rete. Controlla la connessione.';
  }
  render();
}

// ─── Boot ─────────────────────────────────────────────────────────
render();
</script>
